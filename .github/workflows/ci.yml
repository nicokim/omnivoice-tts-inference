name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv run --only-group dev ruff check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv run --extra tn --group test pytest --cov=omnivoice_tts

  floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv run --group test --with "torch==2.8.0" --with "torchaudio==2.8.0" --with "transformers==5.3.0" pytest tests/test_loader.py tests/test_generate.py

  latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # uv.lock pins transformers: without the upgrade this job would never see a newer release
      - run: uv run --upgrade-package transformers --group test pytest tests/test_loader.py tests/test_generate.py
